databases:
  - name: assistance-management-db
    databaseName: assistance_management
    user: assistance_management
    plan: free

services:
  - type: web
    name: assistance-management
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn assistance_project.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: assistance-management-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
